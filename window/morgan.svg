<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b3140"/>
      <stop offset="1" stop-color="#171a22"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8fb4d8" stop-opacity="0"/>
      <stop offset="0.75" stop-color="#8fb4d8" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#dcecff"/>
    </linearGradient>
  </defs>
  <rect x="16" y="16" width="224" height="224" rx="52" fill="url(#tile)"/>
  <rect x="16.5" y="16.5" width="223" height="223" rx="51.5" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>
  <!-- a voice, as five bars -->
  <g fill="#e7edf5">
    <rect x="62" y="96" width="16" height="48" rx="8"/>
    <rect x="91" y="72" width="16" height="96" rx="8"/>
    <rect x="120" y="52" width="16" height="136" rx="8"/>
    <rect x="149" y="80" width="16" height="80" rx="8"/>
    <rect x="178" y="100" width="16" height="40" rx="8"/>
  </g>
  <!-- the sweeping line shown while thinking -->
  <rect x="56" y="204" width="144" height="8" rx="4" fill="#ffffff" fill-opacity="0.08"/>
  <rect x="104" y="204" width="72" height="8" rx="4" fill="url(#sweep)"/>
</svg>
